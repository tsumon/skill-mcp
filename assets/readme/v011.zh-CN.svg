<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">v0.1.1</title>
  <desc id="desc">v0.1.1：安装脚本、suggest 返回可 bind 的 names、热重载、白话遮蔽说明、绑定契约、三级作用域、可选向量路由、CJK 评测金样。</desc>
  <rect width="1200" height="300" rx="26" fill="#121610"/>

  <g id="cap-tally" transform="translate(56 28)">
    <rect width="3.5" height="16" rx="1" fill="#E8B84A"/>
    <rect x="8" width="3.5" height="16" rx="1" fill="#E8B84A"/>
    <rect x="16" width="3.5" height="16" rx="1" fill="#E8B84A"/>
  </g>
  <text x="88" y="42" fill="#8A927E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">RELEASE</text>
  <text x="1144" y="42" text-anchor="end" fill="#C6F25A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">v0.1.1</text>

  <text x="56" y="88" fill="#E8EDE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="32" font-weight="700">这一版落地的内容</text>

  <text x="56" y="136" fill="#C6F25A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">01</text>
  <text x="100" y="136" fill="#E8EDE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">安装脚本 + 绝对路径 mcp.json</text>
  <text x="620" y="136" fill="#C6F25A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">02</text>
  <text x="664" y="136" fill="#E8EDE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">suggest names[] 可直接 bind</text>

  <text x="56" y="176" fill="#C6F25A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">03</text>
  <text x="100" y="176" fill="#E8EDE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">rescan_skills 无需重启进程</text>
  <text x="620" y="176" fill="#C6F25A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">04</text>
  <text x="664" y="176" fill="#E8EDE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">白话说明谁遮蔽了技能</text>

  <text x="56" y="216" fill="#C6F25A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">05</text>
  <text x="100" y="216" fill="#E8EDE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">绑定契约：只用这 N 个</text>
  <text x="620" y="216" fill="#C6F25A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">06</text>
  <text x="664" y="216" fill="#E8EDE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">session / project / global</text>

  <text x="56" y="256" fill="#C6F25A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">07</text>
  <text x="100" y="256" fill="#E8EDE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">默认词法；Ollama 可选升级</text>
  <text x="620" y="256" fill="#C6F25A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">08</text>
  <text x="664" y="256" fill="#E8EDE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">CJK + 冲突评测金样</text>
</svg>
