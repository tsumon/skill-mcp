<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">One-shot install writes absolute mcp.json paths</title>
  <desc id="desc">./scripts/install.sh builds skill-mcp and writes Claude Desktop and Cursor mcp.json snippets whose args use an absolute path to dist/index.js.</desc>
  <rect width="1200" height="340" rx="26" fill="#121610"/>

  <g id="cap-tally" transform="translate(56 32)">
    <rect width="3.5" height="16" rx="1" fill="#E8B84A"/>
    <rect x="8" width="3.5" height="16" rx="1" fill="#E8B84A"/>
    <rect x="16" width="3.5" height="16" rx="1" fill="#E8B84A"/>
  </g>
  <text x="88" y="46" fill="#8A927E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">INSTALL</text>
  <text x="1144" y="46" text-anchor="end" fill="#8A927E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">ABSOLUTE PATHS ONLY</text>

  <text x="56" y="92" fill="#E8EDE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="32" font-weight="700">One command wires the host</text>
  <text x="56" y="124" fill="#8A927E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">stdio MCP. No marketplace. Copy docs/output after install.</text>

  <g id="cmd">
    <rect x="56" y="148" width="1088" height="56" rx="14" fill="#1C2218" stroke="#2E3828" stroke-width="1.25"/>
    <text x="76" y="184" fill="#C6F25A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">$ ./scripts/install.sh</text>
  </g>

  <g id="claude">
    <rect x="56" y="220" width="532" height="88" rx="14" fill="#1C2218" stroke="#2E3828" stroke-width="1.25"/>
    <text x="76" y="252" fill="#8A927E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">CLAUDE DESKTOP</text>
    <text x="76" y="284" fill="#E8EDE3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">docs/output/claude-desktop.mcp.json</text>
  </g>

  <g id="cursor">
    <rect x="612" y="220" width="532" height="88" rx="14" fill="#1C2218" stroke="#2E3828" stroke-width="1.25"/>
    <text x="632" y="252" fill="#8A927E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">CURSOR</text>
    <text x="632" y="284" fill="#E8EDE3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">docs/output/cursor.mcp.json</text>
  </g>
</svg>
