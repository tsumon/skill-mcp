<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">G dry-run / --apply and H enable / restore</title>
  <desc id="desc">Auto-uninstall defaults to dry-run; only --apply or apply:true moves idle and shadowed user skills into a recoverable archive. Native-skills bypass writes Claude skillOverrides name-only; restore reverts the previous settings in one step.</desc>
  <rect width="1200" height="360" rx="26" fill="#121610"/>

  <g id="cap-tally" transform="translate(56 28)">
    <rect width="3.5" height="16" rx="1" fill="#E8B84A"/>
    <rect x="8" width="3.5" height="16" rx="1" fill="#E8B84A"/>
    <rect x="16" width="3.5" height="16" rx="1" fill="#E8B84A"/>
  </g>
  <text x="88" y="42" fill="#8A927E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">SWITCHES</text>
  <text x="1144" y="42" text-anchor="end" fill="#8A927E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">DEFAULT SAFE · ONE-STEP UNDO</text>

  <g id="g">
    <rect x="56" y="72" width="532" height="248" rx="14" fill="#1C2218" stroke="#2E3828" stroke-width="1.25"/>
    <text x="76" y="108" fill="#E8B84A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">G  AUTO-UNINSTALL</text>
    <text x="76" y="148" fill="#C6F25A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">default</text>
    <text x="168" y="148" fill="#E8EDE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">dry-run — report, do not move</text>
    <text x="76" y="188" fill="#E8B84A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">--apply</text>
    <text x="168" y="188" fill="#E8EDE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">move to recoverable archive</text>
    <text x="76" y="228" fill="#8A927E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Targets idle and shadowed user-tier skills.</text>
    <text x="76" y="260" fill="#8A927E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Never silent-deletes. Restore from archive/.</text>
    <text x="76" y="296" fill="#5C6454" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">node dist/index.js archive-idle [--apply]</text>
  </g>

  <g id="h">
    <rect x="612" y="72" width="532" height="248" rx="14" fill="#1C2218" stroke="#2E3828" stroke-width="1.25"/>
    <text x="632" y="108" fill="#E8B84A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">H  NATIVE SKILLS</text>
    <text x="632" y="148" fill="#C6F25A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">enable</text>
    <text x="724" y="148" fill="#E8EDE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">skillOverrides name-only</text>
    <text x="632" y="188" fill="#E8B84A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">restore</text>
    <text x="724" y="188" fill="#E8EDE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">revert prior settings.json</text>
    <text x="632" y="228" fill="#8A927E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Stops the host dumping every description.</text>
    <text x="632" y="260" fill="#E8B84A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Risk: routing fight with Claude Code skills.</text>
    <text x="632" y="296" fill="#5C6454" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">native-skills enable | restore</text>
  </g>
</svg>
