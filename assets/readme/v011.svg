<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">v0.1.1</title>
  <desc id="desc">Release v0.1.1: install script, suggest names for bind, rescan, plain-language shadowing, binding contract, session/project/global scopes, optional embeddings, CJK eval goldens.</desc>
  <rect width="1200" height="300" rx="26" fill="#121610"/>

  <g id="cap-tally" transform="translate(56 28)">
