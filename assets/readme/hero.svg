<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">skill-mcp</title>
  <desc id="desc">Local stdio MCP server. Lists, suggests, and binds at most three local SKILL.md files. Token budget never raises the cap. Host contract, dry-run archive, native-skills bypass.</desc>

  <rect width="1200" height="360" rx="26" fill="#121610"/>

  <g id="cap-tally" transform="translate(56 40)">
    <rect width="3.5" height="16" rx="1" fill="#E8B84A"/>
    <rect x="8" width="3.5" height="16" rx="1" fill="#E8B84A"/>
    <rect x="16" width="3.5" height="16" rx="1" fill="#E8B84A"/>
  </g>

  <text x="88" y="54" fill="#8A927E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">LOCAL STDIO MCP</text>
  <text x="1144" y="54" text-anchor="end" fill="#8A927E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">v0.2.0 · MIT · NODE 20+</text>

  <g id="title-block">
    <text x="56" y="118" fill="#E8EDE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="56" font-weight="700">skill-mcp</text>
    <text x="56" y="164" fill="#E8EDE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22">Pick which local SKILL.md files an agent should use.</text>
    <text x="56" y="194" fill="#C6F25A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22">Bind at most 3. Then write a host contract.</text>
  </g>

  <g id="hard-limits" transform="translate(748 72)">
    <rect width="396" height="136" rx="14" fill="#1C2218" stroke="#2E3828" stroke-width="1.25"/>
    <text x="24" y="34" fill="#8A927E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">HARD LIMITS</text>
    <text x="24" y="76" fill="#E8B84A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="32" font-weight="700">3</text>
    <text x="78" y="76" fill="#E8EDE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">cap — never raised by budget</text>
    <text x="24" y="114" fill="#C6F25A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="32" font-weight="700">4000</text>
    <text x="122" y="114" fill="#E8EDE3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">token budget · CJK-aware</text>
  </g>

  <g id="core-loop">
    <rect x="56" y="232" width="1088" height="88" rx="14" fill="#1C2218" stroke="#2E3828" stroke-width="1.25"/>

    <text x="80" y="268" fill="#8A927E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">01</text>
    <text x="114" y="268" fill="#E8EDE3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600">suggest</text>
    <text x="80" y="296" fill="#8A927E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">cap 3, then budget</text>

    <text x="300" y="282" fill="#5C6454" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">→</text>

    <text x="340" y="268" fill="#C6F25A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">02</text>
    <text x="374" y="268" fill="#E8EDE3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600">bind</text>
    <text x="340" y="296" fill="#8A927E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">lean name/desc/path</text>

    <text x="560" y="282" fill="#5C6454" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">→</text>

    <text x="600" y="268" fill="#8A927E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">03</text>
    <text x="634" y="268" fill="#E8EDE3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600">contract</text>
    <text x="600" y="296" fill="#8A927E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">Claude + Cursor rules</text>

    <rect x="900" y="258" width="22" height="16" rx="3" fill="#C6F25A"/>
    <rect x="928" y="258" width="22" height="16" rx="3" fill="#C6F25A"/>
    <rect x="956" y="258" width="22" height="16" rx="3" fill="#C6F25A"/>
    <text x="900" y="296" fill="#8A927E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">3 SLOTS · DRY-RUN G</text>
  </g>
</svg>
